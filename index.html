<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;900&display=swap">
<style>
  :root {
    --ground: #0b0b0d;
    --tile: #131316;
    --line: #25252b;
    --text: #f3f3f5;
    --muted: #85858f;
    --ease: cubic-bezier(.22, .8, .24, 1);
    --bar: 72px;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--ground); scroll-behavior: smooth; }
  body {
    margin: 0;
    min-height: 100svh;
    background: var(--ground);
    color: var(--text);
    font-family: "Instrument Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }
  body.locked { overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 1px solid var(--text); outline-offset: 4px; }

  /* ---------- Barra superior ---------- */
  .bar {
    position: fixed; inset: 0 0 auto 0; z-index: 30;
    padding-top: env(safe-area-inset-top, 0px);
    background: linear-gradient(to bottom, var(--ground) 55%, transparent);
  }
  .bar-in {
    height: var(--bar);
    max-width: 1680px; margin: 0 auto;
    padding-inline: clamp(16px, 4vw, 56px);
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
  }
  .logo { display: block; width: 40px; height: 40px; transition: transform .5s var(--ease), opacity .3s; }
  .logo img { display: block; width: 100%; height: 100%; }
  .logo:hover { transform: rotate(18deg) scale(1.06); }

  .nav { display: flex; gap: clamp(20px, 2.6vw, 40px); }
  .nav a {
    position: relative; padding-block: 8px;
    color: var(--muted); letter-spacing: .01em; white-space: nowrap;
    transition: color .3s var(--ease);
  }
  .nav a::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 2px; height: 1px;
    background: var(--text); transform: scaleX(0); transform-origin: left;
    transition: transform .4s var(--ease);
  }
  .nav a:hover, .nav a[aria-current="page"] { color: var(--text); }
  .nav a[aria-current="page"]::after { transform: scaleX(1); }

  .burger { display: none; width: 40px; height: 40px; position: relative; }
  .burger i {
    position: absolute; left: 9px; right: 9px; height: 1.5px; background: var(--text);
    transition: transform .35s var(--ease), top .35s var(--ease);
  }
  .burger i:first-child { top: 15px; }
  .burger i:last-child { top: 24px; }
  .menu-open .burger i:first-child { top: 19.5px; transform: rotate(45deg); }
  .menu-open .burger i:last-child { top: 19.5px; transform: rotate(-45deg); }

  @media (max-width: 860px) {
    :root { --bar: 64px; }
    .burger { display: block; z-index: 2; }
    .logo { position: relative; z-index: 2; }
    .nav {
      position: fixed; inset: 0; z-index: 1;
      flex-direction: column; justify-content: center; gap: 6px;
      padding-inline: clamp(16px, 4vw, 56px);
      background: var(--ground);
      opacity: 0; visibility: hidden;
      transition: opacity .3s var(--ease), visibility 0s .3s;
    }
    .nav a {
      font-size: clamp(1.6rem, 7vw, 2.2rem); padding-block: 10px; white-space: normal;
      opacity: 0; transform: translateY(12px);
      transition: color .3s, opacity .4s var(--ease), transform .4s var(--ease);
    }
    .nav a::after { display: none; }
    .menu-open .nav { opacity: 1; visibility: visible; transition: opacity .3s var(--ease); }
    .menu-open .nav a { opacity: 1; transform: none; transition-delay: calc(60ms + var(--i) * 45ms); }
  }

  /* ---------- Vista ---------- */
  main {
    max-width: 1680px; margin: 0 auto;
    padding-inline: clamp(16px, 4vw, 56px);
    padding-top: calc(var(--bar) + env(safe-area-inset-top, 0px));
    transition: opacity .22s ease, transform .22s ease;
  }
  main.leaving { opacity: 0; transform: translateY(8px); }

  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  .rise { animation: rise .7s var(--ease) both; animation-delay: calc(var(--i, 0) * 55ms); }

  /* ---------- Inicio ---------- */
  .home {
    min-height: calc(100svh - var(--bar) - env(safe-area-inset-top, 0px));
    display: grid; place-items: center;
    padding-block: 32px 96px;
  }
  .skills { list-style: none; margin: 0; padding: 0; display: grid; gap: clamp(28px, 5vh, 52px); }
  .skills li {
    display: flex; align-items: center; gap: clamp(18px, 3vw, 32px);
    font-size: clamp(1rem, .7rem + 1.9vw, 2.3rem); letter-spacing: -.015em; line-height: 1.15;
    color: var(--muted);
  }
  .skills b { font-weight: 500; color: var(--text); }
  .app {
    flex: none; width: clamp(48px, 5.4vw, 72px); aspect-ratio: 1;
    display: grid; place-items: center;
    border: 1.5px solid var(--text); border-radius: 22%;
    color: var(--text); font-weight: 500; font-size: .82em; letter-spacing: -.02em;
    transition: background-color .35s var(--ease), color .35s var(--ease), transform .45s var(--ease);
  }
  .skills li:hover .app { background: var(--text); color: var(--ground); transform: translateY(-3px); }

  /* ---------- Galería ---------- */
  .gallery { display: grid; gap: clamp(10px, 1.4vw, 20px); padding-block: clamp(16px, 3vw, 40px) 0; }
  .g-portrait { grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); }
  .g-square   { grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
  .g-wide     { grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); }
  .g-logo     { grid-template-columns: repeat(3, 1fr); max-width: 1200px; margin-inline: auto; }
  @media (max-width: 560px) {
    .g-portrait, .g-square, .g-wide { grid-template-columns: 1fr; }
  }

  .work {
    display: block; width: 100%; max-width: 100%;
    position: relative; overflow: hidden;
    background: var(--tile); cursor: zoom-in;
  }
  .work img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
    opacity: 0; transition: opacity .6s ease, transform .7s var(--ease);
  }
  .work img.ready { opacity: 1; }
  .g-logo .work img { inset: 14%; width: 72%; height: 72%; }
  @media (hover: hover) {
    .work:hover img { transform: scale(1.035); }
  }

  /* ---------- Paso entre carpetas ---------- */
  .pager {
    display: flex; justify-content: space-between; gap: 24px;
    padding-block: clamp(56px, 9vw, 120px) clamp(40px, 6vw, 80px);
  }
  .pager a {
    display: inline-flex; align-items: center; gap: 14px;
    color: var(--muted); font-size: clamp(1rem, .9rem + .5vw, 1.3rem);
    transition: color .3s var(--ease);
  }
  .pager a:hover { color: var(--text); }
  .pager svg { flex: none; width: 22px; height: 22px; transition: transform .4s var(--ease); }
  .pager .next { margin-left: auto; text-align: right; }
  .pager .prev:hover svg { transform: translateX(-5px); }
  .pager .next:hover svg { transform: translateX(5px); }
  .pager .prev img { width: 26px; height: 26px; display: block; }

  /* ---------- Vista ampliada ---------- */
  .lb {
    position: fixed; inset: 0; z-index: 50;
    display: grid; place-items: center;
    background: rgba(6, 6, 8, .94);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    opacity: 0; visibility: hidden;
    transition: opacity .3s ease, visibility 0s .3s;
    touch-action: pan-y;
  }
  .lb.open { opacity: 1; visibility: visible; transition: opacity .3s ease; }
  .lb-img {
    max-width: min(100vw - 32px, 1600px);
    max-height: calc(100svh - 120px);
    width: auto; height: auto; object-fit: contain; display: block;
    cursor: zoom-out;
    opacity: 0; transform: scale(.955);
    transition: opacity .32s ease, transform .5s var(--ease);
  }
  .lb.open .lb-img.ready { opacity: 1; transform: none; }
  .lb-btn {
    position: absolute; z-index: 2; width: 48px; height: 48px;
    display: grid; place-items: center; border-radius: 50%;
    color: var(--muted); transition: color .3s, background-color .3s, transform .4s var(--ease);
  }
  .lb-btn:hover { color: var(--text); background: rgba(255, 255, 255, .07); }
  .lb-btn svg { width: 22px; height: 22px; }
  .lb-close { top: calc(12px + env(safe-area-inset-top, 0px)); right: clamp(12px, 3vw, 40px); }
  .lb-close:hover { transform: rotate(90deg); }
  .lb-prev { left: clamp(8px, 2vw, 32px); top: 50%; margin-top: -24px; }
  .lb-next { right: clamp(8px, 2vw, 32px); top: 50%; margin-top: -24px; }
  @media (max-width: 700px) {
    .lb-prev, .lb-next { top: auto; margin: 0; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
    .lb-prev { left: calc(50% - 60px); }
    .lb-next { right: calc(50% - 60px); }
    .lb-img { max-height: calc(100svh - 150px); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
    html { scroll-behavior: auto; }
  }
</style>

<body>

<header class="bar">
  <div class="bar-in">
    <a class="logo" href="#/" aria-label="Inicio"><img src="img/logo.png" alt="" width="40" height="40"></a>
    <nav class="nav" id="nav"></nav>
    <button class="burger" id="burger" type="button" aria-label="Menú" aria-expanded="false" aria-controls="nav"><i></i><i></i></button>
  </div>
</header>

<main id="view"></main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-hidden="true">
  <button class="lb-btn lb-close" id="lbClose" type="button" aria-label="Cerrar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
  </button>
  <button class="lb-btn lb-prev" id="lbPrev" type="button" aria-label="Anterior">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l-8 8 8 8"/></svg>
  </button>
  <img class="lb-img" id="lbImg" alt="">
  <button class="lb-btn lb-next" id="lbNext" type="button" aria-label="Siguiente">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4l8 8-8 8"/></svg>
  </button>
</div>

<script>
(function () {
  /* Carpetas detectadas en los archivos entregados, en su orden. */
  var FOLDERS = [{"name":"Portadas Musicales","slug":"portadas-musicales","kind":"square","items":[["portadas-01.webp",1600,1600],["portadas-02.webp",1600,1600],["portadas-03.webp",1600,1600],["portadas-04.webp",1600,1600],["portadas-05.webp",1600,1600],["portadas-06.webp",1600,1600],["portadas-07.webp",1600,1600],["portadas-08.webp",1600,1600],["portadas-09.webp",1600,1600],["portadas-10.webp",1600,1600],["portadas-11.webp",1600,1600],["portadas-12.webp",1600,1600],["portadas-13.webp",1600,1600],["portadas-14.webp",1600,1600],["portadas-15.webp",1600,1600]]},{"name":"Discotecas","slug":"discotecas","kind":"portrait","items":[["discotecas-01.webp",1080,1920],["discotecas-02.webp",1080,1920],["discotecas-03.webp",1080,1920],["discotecas-04.webp",1080,1920],["discotecas-05.webp",1080,1920],["discotecas-06.webp",1080,1920],["discotecas-07.webp",1080,1920],["discotecas-08.webp",1080,1920],["discotecas-09.webp",1080,1920],["discotecas-10.webp",1080,1920],["discotecas-11.webp",1080,1920],["discotecas-12.webp",1080,1920],["discotecas-13.webp",1080,1920],["discotecas-14.webp",1080,1920],["discotecas-15.webp",1081,1920],["discotecas-16.webp",1080,1920],["discotecas-17.webp",1080,1920],["discotecas-18.webp",1080,1920]]},{"name":"Flyers Stream","slug":"flyers-stream","kind":"portrait","items":[["flyers-01.webp",1080,1920],["flyers-02.webp",1080,1920],["flyers-03.webp",1080,1920],["flyers-04.webp",1080,1920],["flyers-05.webp",1080,1920],["flyers-06.webp",1080,1920],["flyers-07.webp",1080,1920],["flyers-08.webp",1080,1920],["flyers-09.webp",1080,1920],["flyers-10.webp",1080,1920],["flyers-11.webp",1080,1920],["flyers-12.webp",1080,1920],["flyers-13.webp",1080,1920],["flyers-14.webp",1080,1920],["flyers-15.webp",1080,1920],["flyers-16.webp",1080,1920],["flyers-17.webp",1080,1920],["flyers-18.webp",1080,1920],["flyers-19.webp",1080,1920],["flyers-20.webp",1080,1920],["flyers-21.webp",1080,1920],["flyers-22.webp",1080,1920],["flyers-23.webp",1080,1920],["flyers-24.webp",1080,1920],["flyers-25.webp",1080,1920],["flyers-26.webp",1080,1920],["flyers-27.webp",1080,1920],["flyers-28.webp",1080,1920],["flyers-29.webp",1080,1920],["flyers-30.webp",1080,1920],["flyers-31.webp",1080,1920],["flyers-32.webp",1080,1920],["flyers-33.webp",1080,1920],["flyers-34.webp",1080,1920],["flyers-35.webp",1080,1920],["flyers-36.webp",1080,1920],["flyers-37.webp",1080,1920],["flyers-38.webp",1080,1920],["flyers-39.webp",1080,1920],["flyers-40.webp",1080,1920],["flyers-41.webp",1080,1920],["flyers-42.webp",1080,1920],["flyers-43.webp",1080,1920],["flyers-44.webp",1080,1920],["flyers-45.webp",1080,1920],["flyers-46.webp",1080,1920],["flyers-47.webp",1080,1920],["flyers-48.webp",1080,1920],["flyers-49.webp",1080,1920]]},{"name":"Logos","slug":"logos","kind":"logo","items":[["logos-eeb.webp",1400,1400],["logos-hekl.webp",1400,1400],["logos-jijas.webp",1400,1400],["logos-ldxld.webp",1400,1400],["logos-newidea.webp",1400,1400],["logos-notipay.webp",1400,1400],["logos-pf.webp",1400,1400],["logos-solved.webp",1400,1400],["logos-splot.webp",1400,1400]]},{"name":"Miniaturas YT","slug":"miniaturas-yt","kind":"wide","items":[["miniaturas-01.webp",1600,901],["miniaturas-02.webp",1600,900],["miniaturas-03.webp",1600,900],["miniaturas-04.webp",1600,900],["miniaturas-05.webp",1600,900],["miniaturas-06.webp",1600,900],["miniaturas-07.webp",1600,900],["miniaturas-08.webp",1600,900],["miniaturas-09.webp",1600,900],["miniaturas-10.webp",1600,873],["miniaturas-11.webp",1600,900],["miniaturas-12.webp",1600,900],["miniaturas-13.webp",1600,900],["miniaturas-14.webp",1600,900],["miniaturas-15.webp",1600,873],["miniaturas-16.webp",1600,873],["miniaturas-17.webp",1600,901],["miniaturas-18.webp",1600,873],["miniaturas-19.webp",1600,900],["miniaturas-20.webp",1600,900],["miniaturas-21.webp",1600,900],["miniaturas-22.webp",1600,900]]}];

  var SKILLS = [["Ps", "Photoshop"], ["Ai", "Illustrator"], ["Pr", "Premiere Pro"]];
  var ARROW_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4M10 6l-6 6 6 6"/></svg>';
  var ARROW_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"/></svg>';

  var view = document.getElementById("view");
  var nav = document.getElementById("nav");
  var burger = document.getElementById("burger");
  var root = document.documentElement;
  var current = null;

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  nav.innerHTML = FOLDERS.map(function (f, i) {
    return '<a href="#/' + f.slug + '" style="--i:' + i + '">' + esc(f.name) + "</a>";
  }).join("");

  function setMenu(open) {
    root.classList.toggle("menu-open", open);
    document.body.classList.toggle("locked", open);
    burger.setAttribute("aria-expanded", open ? "true" : "false");
  }
  burger.addEventListener("click", function () { setMenu(!root.classList.contains("menu-open")); });
  nav.addEventListener("click", function (e) { if (e.target.closest("a")) setMenu(false); });

  function homeHTML() {
    return '<section class="home" id="inicio"><ul class="skills">' + SKILLS.map(function (s, i) {
      return '<li class="rise" style="--i:' + (i * 2 + 1) + '"><span class="app" aria-hidden="true">' + s[0] +
        "</span><span>Nivel de <b>" + s[1] + " Avanzado</b></span></li>";
    }).join("") + "</ul></section>";
  }

  function folderHTML(idx) {
    var f = FOLDERS[idx];
    var items = f.items.map(function (it, i) {
      return '<button type="button" class="work rise" data-folder="' + idx + '" data-i="' + i + '" style="--i:' + Math.min(i, 14) +
        ";aspect-ratio:" + (f.kind === "logo" ? "1 / 1" : it[1] + " / " + it[2]) + '">' +
        '<img src="img/' + it[0] + '" alt="' + esc(f.name) + " " + (i + 1) + '" width="' + it[1] + '" height="' + it[2] +
        '"' + ' loading="lazy"' + ' decoding="async"></button>';
    }).join("");
    return '<section class="portfolio-section" id="' + f.slug + '" aria-labelledby="title-' + f.slug + '"><h2 class="category-title" id="title-' + f.slug + '">' + esc(f.name) + '</h2><div class="gallery g-' + f.kind + '">' + items + '</div></section>';
  }

  function wireImages() {
    view.querySelectorAll(".work img").forEach(function (img) {
      if (img.complete && img.naturalWidth) img.classList.add("ready");
      else img.addEventListener("load", function () { img.classList.add("ready"); }, { once: true });
    });
  }

  function route() {
    var slug;
    try { slug = decodeURIComponent((location.hash || "").replace(/^#\/?/, "")); }
    catch (e) { slug = ""; }
    closeLb();
    var target = document.getElementById(slug || "inicio");
    if (target) target.scrollIntoView({block: "start"});
  }
  window.addEventListener("hashchange", route);
  document.querySelector(".logo").addEventListener("click", function () { setMenu(false); });
  nav.addEventListener("click", function (e) {
    var link = e.target.closest("a");
    if (link && link.hash === location.hash) route();
  });

  /* ---------- Vista ampliada ---------- */
  var lb = document.getElementById("lb");
  var lbImg = document.getElementById("lbImg");
  var lbPos = 0, lastFocus = null;

  function showLb(i) {
    var items = FOLDERS[current].items;
    lbPos = (i + items.length) % items.length;
    lbImg.classList.remove("ready");
    var src = "img/" + items[lbPos][0];
    setTimeout(function () {
      lbImg.onload = function () { lbImg.classList.add("ready"); };
      lbImg.src = src;
      lbImg.alt = FOLDERS[current].name + " " + (lbPos + 1);
      if (lbImg.complete && lbImg.naturalWidth) lbImg.classList.add("ready");
      [1, -1].forEach(function (d) { var n = items[(lbPos + d + items.length) % items.length]; new Image().src = "img/" + n[0]; });
    }, lb.classList.contains("open") ? 160 : 0);
  }
  function openLb(i) {
    lastFocus = document.activeElement;
    showLb(i);
    lb.classList.add("open"); lb.setAttribute("aria-hidden", "false");
    document.body.classList.add("locked");
    document.getElementById("lbClose").focus({ preventScroll: true });
  }
  function closeLb() {
    if (!lb.classList.contains("open")) return;
    lb.classList.remove("open"); lb.setAttribute("aria-hidden", "true");
    document.body.classList.remove("locked");
    lbImg.classList.remove("ready");
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }

  view.addEventListener("click", function (e) {
    var w = e.target.closest(".work");
    if (w) { current = +w.dataset.folder; openLb(+w.dataset.i); }
  });
  lb.addEventListener("click", function (e) {
    if (e.target.closest("#lbPrev")) showLb(lbPos - 1);
    else if (e.target.closest("#lbNext")) showLb(lbPos + 1);
    else closeLb();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeLb(); setMenu(false); }
    if (!lb.classList.contains("open")) return;
    if (e.key === "ArrowLeft") showLb(lbPos - 1);
    if (e.key === "ArrowRight") showLb(lbPos + 1);
  });
  var tx = null;
  lb.addEventListener("touchstart", function (e) { tx = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener("touchend", function (e) {
    if (tx === null) return;
    var dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 48) showLb(lbPos + (dx < 0 ? 1 : -1));
  }, { passive: true });

  view.innerHTML = homeHTML() + FOLDERS.map(function (f, i) { return folderHTML(i); }).join("");
  wireImages();
  if ("IntersectionObserver" in window) {
    var sections = document.querySelectorAll(".home, .portfolio-section");
    var activeObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        nav.querySelectorAll("a").forEach(function (a) {
          if (a.hash === "#/" + entry.target.id) a.setAttribute("aria-current", "location");
          else a.removeAttribute("aria-current");
        });
      });
    }, {rootMargin: "-20% 0px -60% 0px", threshold: 0});
    sections.forEach(function (section) { activeObserver.observe(section); });
  }
  route();
